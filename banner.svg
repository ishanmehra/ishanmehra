<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Ishan Mehra — Backend Engineer. Event-driven pipeline: events, BullMQ queue, LLM router, generated content." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0c2a3a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#9fe8ff"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3b4a" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style><![CDATA[
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .name { font-size: 46px; font-weight: 700; letter-spacing: -1.2px; fill: url(#nameFill); }
      .role { font-size: 14.5px; font-weight: 500; fill: #7fb3c8; letter-spacing: 0.2px; }
      .stat-n { font-size: 17px; font-weight: 700; fill: #00d9ff; }
      .stat-l { font-size: 10px; font-weight: 500; fill: #5d8798; letter-spacing: 0.4px; }
      .chip-t { font-size: 12.5px; font-weight: 600; fill: #cfeaf5; }
      .chip-s { font-size: 9.5px; font-weight: 500; fill: #5d8798; }
      .chip-bx { fill: #101d26; stroke: #1f4a5e; stroke-width: 1.2; }

      .tok { fill: #ffb347; }
      .tok-c { fill: #00d9ff; }

      @keyframes flow {
        0%   { transform: translateX(0);    opacity: 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translateX(76px); opacity: 0; }
      }
      @keyframes depth {
        0%, 100% { opacity: 0.18; }
        50%      { opacity: 1; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.85; }
      }

      .f  { animation: flow 2.4s linear infinite; }
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: 0.8s; }
      .d3 { animation-delay: 1.6s; }
      .g2 { animation-delay: 0.4s; }
      .g3 { animation-delay: 0.9s; }

      .q  { animation: depth 2.4s ease-in-out infinite; }
      .q1 { animation-delay: 0s; }
      .q2 { animation-delay: 0.3s; }
      .q3 { animation-delay: 0.6s; }
      .q4 { animation-delay: 0.9s; }

      .pulse { animation: breathe 3.2s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .f, .q, .pulse { animation: none; opacity: 1; }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="260" fill="none" stroke="#1f4a5e" stroke-width="1.5"/>

  <!-- identity -->
  <text class="mono name" x="46" y="78">Ishan Mehra</text>
  <rect x="48" y="92" width="300" height="1.5" fill="url(#rule)"/>
  <text class="mono role" x="46" y="114">Backend Engineer · event-driven systems · AI/LLM pipelines</text>

  <!-- production numbers -->
  <g text-anchor="end">
    <text class="mono stat-n" x="826" y="58">1,500+</text>
    <text class="mono stat-l" x="826" y="73">content types</text>
    <text class="mono stat-n" x="994" y="58">9,700+</text>
    <text class="mono stat-l" x="994" y="73">messages / mo</text>
    <text class="mono stat-n" x="1154" y="58">89%</text>
    <text class="mono stat-l" x="1154" y="73">delivery rate</text>
  </g>
  <g stroke="#1f4a5e" stroke-width="1">
    <line x1="850" y1="44" x2="850" y2="78"/>
    <line x1="1018" y1="44" x2="1018" y2="78"/>
  </g>

  <!-- pipeline rails -->
  <g stroke="#1f4a5e" stroke-width="1.4">
    <line x1="224" y1="192" x2="300" y2="192"/>
    <line x1="500" y1="192" x2="576" y2="192"/>
    <line x1="796" y1="192" x2="872" y2="192"/>
  </g>

  <!-- stage 1: events -->
  <g>
    <rect class="chip-bx" x="46" y="170" width="178" height="44" rx="6"/>
    <circle class="pulse" cx="68" cy="192" r="4" fill="#ffb347"/>
    <text class="mono chip-t" x="84" y="189">events</text>
    <text class="mono chip-s" x="84" y="203">badges · joins · triggers</text>
  </g>

  <!-- stage 2: queue -->
  <g>
    <rect class="chip-bx" x="300" y="170" width="200" height="44" rx="6"/>
    <text class="mono chip-t" x="316" y="189">BullMQ</text>
    <text class="mono chip-s" x="316" y="203">distributed job queue</text>
    <g fill="#00d9ff">
      <rect class="q q1" x="462" y="196" width="4" height="8" rx="1"/>
      <rect class="q q2" x="470" y="192" width="4" height="12" rx="1"/>
      <rect class="q q3" x="478" y="188" width="4" height="16" rx="1"/>
      <rect class="q q4" x="486" y="184" width="4" height="20" rx="1"/>
    </g>
  </g>

  <!-- stage 3: llm router -->
  <g>
    <rect class="chip-bx" x="576" y="170" width="220" height="44" rx="6"/>
    <circle cx="598" cy="192" r="4" fill="#00d9ff" filter="url(#glow)"/>
    <text class="mono chip-t" x="614" y="189">LLM router</text>
    <text class="mono chip-s" x="614" y="203">multi-model · concurrent calls</text>
  </g>

  <!-- stage 4: output -->
  <g>
    <rect class="chip-bx" x="872" y="170" width="200" height="44" rx="6"/>
    <text class="mono chip-t" x="888" y="189">ingestion</text>
    <text class="mono chip-s" x="888" y="203">worksheets · guides</text>
    <circle class="pulse" cx="1052" cy="192" r="4" fill="#3fb950"/>
  </g>

  <!-- payloads in flight -->
  <g>
    <g transform="translate(224 0)">
      <rect class="tok f d1" x="0" y="188" width="10" height="8" rx="2"/>
      <rect class="tok f d2" x="0" y="188" width="10" height="8" rx="2"/>
      <rect class="tok f d3" x="0" y="188" width="10" height="8" rx="2"/>
    </g>
    <g transform="translate(500 0)">
      <rect class="tok f d1 g2" x="0" y="188" width="10" height="8" rx="2"/>
      <rect class="tok f d3 g2" x="0" y="188" width="10" height="8" rx="2"/>
    </g>
    <g transform="translate(796 0)">
      <rect class="tok-c f d2 g3" x="0" y="188" width="10" height="8" rx="2"/>
      <rect class="tok-c f d3 g3" x="0" y="188" width="10" height="8" rx="2"/>
    </g>
  </g>

  <text class="mono" x="46" y="240" font-size="10.5" fill="#42697a">sole backend engineer @ Edzy — architecture to deployment</text>
</svg>
